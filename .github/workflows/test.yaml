name: 'Run Tests'

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yaml'
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yaml'

# Cancel in-progress runs on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read  # Least privilege default

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for magic-nix-cache
      contents: read
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39  # v8

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Setup devshell
        uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95  # main

      - name: Setup Rust cache
        uses: andyl-technologies/github-actions/rust-cache@a1b683853d3459471b7661235be4b76eda58c652 # master
        with:
          cache-all-crates: true
          use-sccache: true

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Check compilation
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo nextest run --workspace

      - name: Build WASM targets
        run: |
          for target in wasm32-unknown-unknown wasm32-wasip2; do
            cargo build --release --workspace --target "$target"
          done

      - name: Build and run test runner
        run: tests/runner/build.sh

  test-miri:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39  # v8

      - name: Setup miri devshell
        uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95  # main
        with:
          arguments: .#miri

      - name: Setup Rust cache
        uses: andyl-technologies/github-actions/rust-cache@a1b683853d3459471b7661235be4b76eda58c652 # master
        with:
          cache-all-crates: true

      - name: Setup miri
        run: cargo miri setup

      - name: Run miri tests
        run: cargo miri nextest run --workspace

  coverage:
    runs-on: ubuntu-latest
    # Only run on trusted code (not fork PRs) to prevent PR comment injection
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39  # v8

      - name: Setup devshell
        uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95  # main

      - name: Setup Rust cache
        uses: andyl-technologies/github-actions/rust-cache@a1b683853d3459471b7661235be4b76eda58c652 # master

      - name: Build test artifacts
        run: tests/runner/build.sh >/dev/null

      - name: Run coverage tests
        run: |
          WASM_DIR="target/wasm32-unknown-unknown/release"
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --no-report --release
          cargo llvm-cov run --bin runner -p runner --release --no-report -- --wasm-dir "$WASM_DIR"
          cargo llvm-cov run --bin async-runner -p runner --release --no-report -- --wasm-dir "$WASM_DIR"
          cargo llvm-cov report --release --cobertura --output-path coverage.cobertura.xml
          cargo llvm-cov report --release --lcov --output-path coverage.lcov

      - name: Generate coverage report
        uses: clearlyip/code-coverage-report-action@9e2cd22e39153feba8b4477e4fefcc0b5e2727ba # v5
        id: code_coverage_report_action
        if: ${{ github.actor != 'dependabot[bot]'}}
        with:
          filename: 'coverage.cobertura.xml'
          artifact_download_workflow_names: '"Run Tests",cron'

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        if: |
          steps.code_coverage_report_action.outputs.file != '' &&
          github.event_name == 'pull_request' && (success() || failure())
        with:
          recreate: true
          path: code-coverage-results.md

  check-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39  # v8

      - name: Setup devshell
        uses: nicknovitski/nix-develop@5da6ac475f1ffbcf54ee562fa3056646e146be95  # main

      - name: Verify crate publishing
        run: cargo publish --dry-run
