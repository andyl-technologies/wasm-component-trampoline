name: 'Run Tests'

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yaml'
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yaml'

# Cancel in-progress runs on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read  # Least privilege default

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for magic-nix-cache
      contents: read
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d  # v16

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@87e8236f46702ab0ce5a058b605a173ec88d618e  # v8

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Setup Rust cache
        uses: andyl-technologies/github-actions/rust-cache@a1b683853d3459471b7661235be4b76eda58c652 # master
        with:
          cache-all-crates: true
          use-sccache: true

      - name: Run tests
        run: |
          nix develop -c bash -c "
            set -e
            cargo fmt --check --all
            cargo check --workspace --all-targets
            cargo nextest run --workspace
            for target in wasm32-unknown-unknown wasm32-wasip2; do
              cargo build --release --workspace --target \$target
            done
            tests/runner/build.sh
          "

  test-miri:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d  # v16

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@87e8236f46702ab0ce5a058b605a173ec88d618e  # v8

      - name: Setup Rust cache
        uses: andyl-technologies/github-actions/rust-cache@a1b683853d3459471b7661235be4b76eda58c652 # master
        with:
          cache-all-crates: true

      - name: Run miri tests
        run: nix develop .#miri -c bash -c 'cargo miri setup && cargo miri nextest run --workspace'

  coverage:
    runs-on: ubuntu-latest
    # Only run on trusted code (not fork PRs) to prevent PR comment injection
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d  # v16

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@87e8236f46702ab0ce5a058b605a173ec88d618e  # v8

      - name: Setup Rust cache
        uses: andyl-technologies/github-actions/rust-cache@a1b683853d3459471b7661235be4b76eda58c652 # master

      - name: Run coverage tests
        run: |
          nix develop -c bash -c '
            set -e
            tests/runner/build.sh >/dev/null
            cargo llvm-cov clean --workspace
            cargo llvm-cov nextest --workspace --no-report --release
            cargo llvm-cov run --bin runner -p runner --release --no-report
            cargo llvm-cov run --bin async-runner -p runner --release --no-report
            cargo llvm-cov report --release --cobertura --output-path coverage.cobertura.xml
            cargo llvm-cov report --release --lcov --output-path coverage.lcov
          '

      - name: Generate coverage report
        uses: clearlyip/code-coverage-report-action@17b6103ac2d3b9bb6c7a8562ac22a4c010d6d52f # v5
        id: code_coverage_report_action
        if: ${{ github.actor != 'dependabot[bot]'}}
        with:
          filename: 'coverage.cobertura.xml'
          artifact_download_workflow_names: '"Run Tests",cron'

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        if: |
          steps.code_coverage_report_action.outputs.file != '' &&
          github.event_name == 'pull_request' && (success() || failure())
        with:
          recreate: true
          path: code-coverage-results.md

  check-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d  # v16

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@87e8236f46702ab0ce5a058b605a173ec88d618e  # v8

      - name: Verify crate publishing
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          dry-run: true
          ignore-unpublished-changes: false

      - name: Verify crate publishing
        run: nix develop -c cargo publish --dry-run
